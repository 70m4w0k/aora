appId: com.tipi.app
---
# Landing Page Test
# This test verifies the landing page loads correctly and key elements are visible
# This is a simple test to verify Maestro setup is working

- launchApp
# Wait for app to fully load and animations to complete
- waitForAnimationToEnd

# Verify main elements are visible
- assertVisible: "Tipi"
- assertVisible: "Manage your shared home together"
- assertVisible: "Get Started"
- assertVisible: "I already have an account"

# Verify feature items are visible
- assertVisible: "Track chores & tasks"
- assertVisible: "Shared shopping lists"
- assertVisible: "Split expenses fairly"
- assertVisible: "Share documents"

# Take screenshot for verification
- takeScreenshot: "landing-page-loaded"

# Test navigation - click Get Started button
- tapOn: "Get Started"
- waitForAnimationToEnd
# Should navigate to sign-up page
- assertVisible: "Create Account"
- takeScreenshot: "navigated-to-signup"

